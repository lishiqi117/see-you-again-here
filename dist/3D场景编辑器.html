<!doctype html>
<html lang="zh-CN">
<head><script src="shared-assets/fetch-chunks.js"></script>
  <meta charset="UTF-8" />
  <script src="./portrait-entry-bridge.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07182d" />
  <title>蜡笔宇宙编辑器</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./space-editor.css?v=20260922-sky-layout" />
</head>
<body class="editor-hidden intro-pending">
  <div class="editor-shell">
    <header class="topbar">
      <div class="brand-block">
        <strong>蜡笔宇宙编辑器</strong>
        <span id="saveState">布局未保存</span>
      </div>

      <div class="mobile-panel-buttons" aria-label="移动端面板">
        <button type="button" data-toggle-panel="assets" aria-controls="assetPanel" aria-expanded="false">资产</button>
        <button type="button" data-toggle-panel="inspector" aria-controls="inspectorPanel" aria-expanded="false">属性</button>
      </div>

      <nav class="project-actions" aria-label="布局操作">
        <button id="resetCamera" type="button">重置视角</button>
        <button id="restoreInitial" type="button">恢复初始</button>
        <button id="loadLayout" type="button">读取保存</button>
        <button id="saveLayout" class="button-primary" type="button">保存布局</button>
        <button id="copyLayoutLink" type="button">保存并复制链接</button>
        <button id="exportLayout" type="button">导出 JSON</button>
      </nav>
    </header>

    <aside id="assetPanel" class="side-panel asset-panel" aria-label="场景资产">
      <div class="panel-heading">
        <div>
          <h1>场景资产</h1>
          <p>点击名称或画面中的模型进行选择</p>
        </div>
        <span id="assetCount" class="asset-count">0</span>
      </div>
      <div id="assetList" class="asset-list" role="listbox" aria-label="资产列表"></div>
    </aside>

    <main id="viewport" class="viewport" aria-label="三维场景视图">
      <canvas id="introBackgroundCanvas" aria-hidden="true"></canvas>
      <canvas id="sceneCanvas" tabindex="0" aria-label="可拖拽游玩、可编辑的三维蜡笔宇宙"></canvas>

      <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite">
        <div class="loading-card">
          <strong>正在准备 3D 资产</strong>
          <span id="loadingText">0 / 14</span>
          <div class="loading-track" aria-hidden="true"><i id="loadingBar"></i></div>
        </div>
      </div>

      <div class="viewport-help">左键拖动旋转视角，滚轮缩放，点击模型进行选择，P 隐藏编辑器</div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>

    <aside id="inspectorPanel" class="side-panel inspector-panel" aria-label="资产属性">
      <div class="group-title-row">
        <button id="selectAllAssets" type="button">全选</button>
        <button id="moveAllDown" type="button">整体下移 ↓</button>
      </div>
      <div class="selection-heading">
        <span>当前选择</span>
        <strong id="selectedName">未选择资产</strong>
      </div>

      <div class="mode-control" aria-label="变换工具">
        <button type="button" class="is-active" data-mode="translate">移动 W</button>
        <button type="button" data-mode="rotate">旋转 E</button>
        <button type="button" data-mode="scale">缩放 R</button>
      </div>

      <fieldset id="transformFields" disabled>
        <section class="property-group">
          <h2>位置</h2>
          <div class="axis-grid">
            <label><span>X</span><input type="number" step="0.1" data-transform="position.x" /></label>
            <label><span>Y</span><input type="number" step="0.1" data-transform="position.y" /></label>
            <label><span>Z</span><input type="number" step="0.1" data-transform="position.z" /></label>
          </div>
        </section>

        <section class="property-group">
          <h2>旋转角度</h2>
          <div class="axis-grid">
            <label><span>X</span><input type="number" step="1" data-transform="rotation.x" /></label>
            <label><span>Y</span><input type="number" step="1" data-transform="rotation.y" /></label>
            <label><span>Z</span><input type="number" step="1" data-transform="rotation.z" /></label>
          </div>
        </section>

        <section class="property-group">
          <div class="group-title-row">
            <h2>大小</h2>
            <label class="link-scale"><input id="uniformScale" type="checkbox" checked /> 等比</label>
          </div>
          <div class="axis-grid">
            <label><span>X</span><input type="number" min="0.05" step="0.05" data-transform="scale.x" /></label>
            <label><span>Y</span><input type="number" min="0.05" step="0.05" data-transform="scale.y" /></label>
            <label><span>Z</span><input type="number" min="0.05" step="0.05" data-transform="scale.z" /></label>
          </div>
        </section>

        <button id="resetSelected" class="full-button" type="button">重置当前资产</button>
      </fieldset>

      <section class="viewer-settings" aria-labelledby="viewerSettingsTitle">
        <div class="group-title-row">
          <h2 id="viewerSettingsTitle">玩家画面</h2>
          <span>隐藏后锁定</span>
        </div>
        <div class="viewer-setting-list">
          <label>
            <span>左右角度</span>
            <span class="number-with-unit"><input id="viewerYaw" type="number" min="5" max="70" step="1" value="34" /><small>°</small></span>
          </label>
          <label>
            <span>上下角度</span>
            <span class="number-with-unit"><input id="viewerPitch" type="number" min="0" max="30" step="1" value="9" /><small>°</small></span>
          </label>
          <label>
            <span>画面大小</span>
            <span class="number-with-unit"><input id="viewerZoom" type="number" min="60" max="160" step="1" value="100" /><small>%</small></span>
          </label>
        </div>
      </section>

      <div class="shortcut-note">
        <strong>快捷操作</strong>
        <p>P 显示或隐藏编辑器，W 移动，E 旋转，R 缩放，F 聚焦当前资产</p>
      </div>
    </aside>
  </div>

  <script src="./space-editor.js?v=20261011-continuous-school-shot"></script>
</body>
</html>
