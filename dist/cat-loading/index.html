<!doctype html>
<html lang="zh-CN">
<head><script src="../shared-assets/fetch-chunks.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#a26c43">
  <title>SEE YOU AGAIN HERE</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./loader.css">
  <style>html,body{margin:0;background:#000;overflow:hidden} .preview-controls{position:fixed;z-index:10001;bottom:24px;right:28px;display:flex;gap:8px;opacity:0;transition:opacity .25s}.preview-controls:hover,.preview-controls:focus-within,body.finished .preview-controls{opacity:1}.preview-controls button{border:1px solid #c7ae8760;border-radius:30px;color:#eddfc6;background:#211b15b3;padding:10px 18px;cursor:pointer;font:12px system-ui} .preview-controls button:focus-visible{outline:2px solid #eddfc6;outline-offset:4px}</style>
</head>
<body>
  <div class="preview-controls"><button id="replay">重新播放</button><button id="pause">暂停</button></div>
  <script src="./gsap.min.js"></script>
  <script src="./loader.js"></script>
  <script>
    let loader;
    function play(){if(loader)loader.destroy();document.body.classList.remove('finished');document.querySelector('#pause').textContent='暂停';loader=new CatLoader({assetBase:'./assets/',demo:true,onComplete(){document.body.classList.add('finished')}});window.catLoader=loader;}
    document.querySelector('#replay').onclick=play;
    document.querySelector('#pause').onclick=function(){loader.togglePause();this.textContent=loader.paused?'继续':'暂停'};
    play();
  </script>
</body>
</html>
