<!doctype html>
<html lang="zh-CN">
<head><script src="shared-assets/fetch-chunks.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080705" />
  <meta name="description" content="记忆街道——点亮台灯，寻找照片里的童年，翻开记忆档案。" />
  <title>记忆街道</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./cat-loading/loader.css" />
</head>
<body>
  <audio id="backgroundMusic" src="./assets/audio/background-music-v2.mp3" loop preload="auto" hidden></audio>
  <script src="./background-music.js"></script>
  <script src="./sound-effects.js?v=20261011-tight-effects"></script>
  <main id="app" aria-live="polite">
    <div class="global-vignette" aria-hidden="true"></div>
    <div class="global-grain" aria-hidden="true"></div>

    <div id="memoryLoader" class="active" aria-label="记忆载入中"></div>

    <section id="lampMemory" class="screen lamp-memory-screen" data-screen="lampMemory" aria-label="点亮台灯，查看童年记忆">
      <div class="lamp-room-photo" aria-hidden="true"><canvas id="lampRoomCanvas" width="1672" height="941"></canvas></div>
      <canvas id="lampRevealCanvas" class="lamp-reveal-canvas" aria-hidden="true"></canvas>
      <div id="lampLightWash" class="lamp-light-wash" aria-hidden="true"></div>
      <div id="lampBeam" class="lamp-beam" aria-hidden="true"></div>
      <canvas id="lampCanvas" class="lamp-3d-canvas" aria-hidden="true"></canvas>
      <div class="lamp-room-shade" aria-hidden="true"></div>
      <button id="lampHotspot" class="lamp-hotspot" type="button" aria-label="点亮并移动台灯"></button>
      <button id="deskArchive" class="desk-archive" type="button" aria-label="查看桌上的档案" aria-haspopup="dialog">
        <img src="./assets/lamp/archive-desk.png" alt="桌上的童年档案" draggable="false" />
      </button>
      <dialog id="deskArchiveDialog" class="desk-archive-dialog" aria-label="童年档案" tabindex="-1">
        <img src="./assets/lamp/archive-cover.jpg" alt="童年档案封面，贴着背粉色书包女孩的照片" />
        <canvas id="archiveOpeningCanvas" class="archive-opening-canvas" width="1920" height="1080" role="img" aria-label="童年档案，向下滚动打开，向上滚动合上"></canvas>
        <video id="archiveOpeningSource" src="./assets/lamp/archive-opening.mp4" preload="auto" muted playsinline disablepictureinpicture disableremoteplayback hidden aria-hidden="true" tabindex="-1"></video>
        <p id="archiveOpeningHint" class="archive-opening-hint">向下滚动，翻开档案</p>
        <button type="button" class="desk-archive-close" aria-label="关闭档案">×</button>
      </dialog>
      <div class="lamp-editor-ui">
        <button id="lampEditToggle" class="lamp-edit-toggle" type="button" aria-expanded="false" aria-controls="lampEditor">编辑台灯位置</button>
        <div id="lampEditor" class="lamp-editor" aria-hidden="true">
          <div class="lamp-editor-heading">
            <strong>台灯位置</strong>
            <span id="lampPositionReadout">X 0.00 · Y 0.00 · Z 0.00</span>
          </div>
          <p>拖动画面移动台灯，滚轮调节前后，也可以使用下面的方向键。</p>
          <div class="lamp-position-pad" aria-label="调整台灯位置">
            <button type="button" data-lamp-move="up" aria-label="向上移动">↑<small>上</small></button>
            <button type="button" data-lamp-move="left" aria-label="向左移动">←<small>左</small></button>
            <button type="button" data-lamp-move="down" aria-label="向下移动">↓<small>下</small></button>
            <button type="button" data-lamp-move="right" aria-label="向右移动">→<small>右</small></button>
            <button type="button" data-lamp-move="forward" aria-label="向前移动">＋<small>向前</small></button>
            <button type="button" data-lamp-move="back" aria-label="向后移动">−<small>向后</small></button>
          </div>
          <div class="lamp-editor-actions">
            <button id="lampPositionReset" type="button">恢复默认</button>
            <button id="lampPositionCancel" type="button">取消</button>
            <button id="lampPositionSave" class="primary" type="button">保存位置</button>
          </div>
          <span id="lampEditorStatus" class="lamp-editor-status" role="status" aria-live="polite"></span>
        </div>
      </div>
      <div class="lamp-light-editor-ui">
        <div id="lampLightEditor" class="lamp-light-editor" aria-hidden="true">
          <div class="lamp-light-editor-heading">
            <strong>光线调节</strong>
            <span>按 E 关闭</span>
          </div>
          <label>
            <span>木板亮度 <output id="lampBoardBrightnessValue">60%</output></span>
            <input id="lampBoardBrightness" type="range" min="30" max="90" step="1" value="60" />
          </label>
          <label>
            <span>灯光亮度 <output id="lampBrightnessValue">135%</output></span>
            <input id="lampBrightness" type="range" min="70" max="180" step="1" value="135" />
          </label>
          <div class="lamp-light-editor-footer">
            <small>调整后自动保存</small>
            <button id="lampLightingReset" type="button">恢复默认</button>
          </div>
        </div>
      </div>
      <div id="lampStageHint" class="lamp-stage-hint">
        <strong id="lampHintTitle">轻触台灯</strong>
        <span id="lampHintDetail">让这段记忆重新亮起来</span>
      </div>
    </section>

  </main>

  <script src="./lamp-scene.js" defer></script>
  <script src="./lamp-background.js" defer></script>
  <script src="./archive-interaction.js" defer></script>
  <script src="./archive-objects.js" defer></script>
  <script src="./portrait-transition.js" defer></script>
  <script src="./lamp-reveal.js" defer></script>
  <script src="./cat-loading/gsap.min.js" defer></script>
  <script src="./cat-loading/loader.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
